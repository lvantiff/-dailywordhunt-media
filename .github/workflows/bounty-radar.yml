name: bounty-radar

on:
  schedule:
    - cron: "23 10 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: bounty-radar
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Unit tests
        run: python -I -m unittest discover -s bounty-radar/tests
      - name: Scan (results are encrypted; only a count summary and salted hashes are public)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python -I bounty-radar/bounty_radar.py \
            --out "$RUNNER_TEMP/radar-plain" \
            --public-dir bounty-radar/data \
            --encrypt-cert bounty-radar/radar-public-cert.pem
      - name: Commit encrypted results
        run: |
          git config user.name "sovereign-bounty-radar"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bounty-radar/data
          if git diff --cached --quiet; then echo "no changes"; exit 0; fi
          git commit -m "radar: scan $(date -u +%Y-%m-%dT%H:%MZ)"
          git pull --rebase origin main
          git push
